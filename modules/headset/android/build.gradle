plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.headset'
version = '0.1.0'

android {
  namespace "expo.modules.headset"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // Used to route playback of an expo-audio player to a chosen output device.
  implementation project(':expo-audio')
  compileOnly 'androidx.media3:media3-exoplayer:1.9.0'
}
